<!DOCTYPE html>

  <style>
    body {
      background: black;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 200px;
      max-width: 1200px;
      margin: 50px auto;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card img {
      width: 100%;
      max-width: 260px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .card button {
      width: 260px;
      padding: 18px;
      font-size: 20px;
      background-color: darkgray;
      color: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
    }

    .card button:hover {
      opacity: 0.9;
    }
  </style>
</head>
